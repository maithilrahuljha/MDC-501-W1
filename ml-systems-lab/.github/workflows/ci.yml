# ==============================================================================
# FILE: .github/workflows/ci.yml
# This file lives at the ROOT of your repository (not inside ml-systems-lab/).
# GitHub only looks for workflows in .github/workflows/ at the repo root.
# THIS IS THE COPY FOR STUDENTS. It assumes the CONTENTS of ml-systems-lab/
# are the root of your own repository (which is what instructions.txt Part G
# walks you through). The original lives at the root of the course repo.
# ==============================================================================
name: CI

# "CI" = continuous integration: every time you push, a free computer
# re-checks your work so you find out about breakage in 90 seconds instead
# of in front of your class. This is Pillar 2 (TESTING) in physical form.
on:
  push:
    branches: ["main", "master"]
    paths:
      - "**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/ci.yml"
  workflow_dispatch: # lets you click "Run workflow" in the Actions tab

jobs:
  # ---------------------------------------------------------------- 1. LINT
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the linter
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.17.3"

      - name: Check style and obvious bugs
        run: ruff check .

  # ---------------------------------------------------------------- 2. TESTS
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: .
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the exact pinned versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: pytest tests -v

  # -------------------------------------------------- 3. SMOKE TEST (REAL RUN)
  # Unit tests import functions. This job does what a user does: starts the
  # actual server and sends the actual requests. If this passes, Lab 1 works.
  smoke-lab1:
    name: Lab 1 smoke test (start server, send requests)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: lab1_break_notebook
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../requirements.txt

      - name: Train the model
        run: python train.py

      - name: Start the service in the background
        run: |
          python app.py &
          echo $! > /tmp/app.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "service is up"
              break
            fi
            sleep 1
          done

      - name: Send the good and bad requests
        run: python test_requests.py

      - name: Stop the service
        if: always()
        run: kill "$(cat /tmp/app.pid)" || true

